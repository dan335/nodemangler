[package]
name = "mangler_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core engine for NodeMangler: a value system, async node-graph executor, and a large library of image, color, and noise operations with 14-color-space conversions."
readme = "README.md"
keywords = ["image-processing", "node-graph", "color", "noise", "graphics"]
categories = ["multimedia::images", "graphics"]

[features]
default = ["raw"]
# Camera RAW decode via rawler (LGPL-2.1). On by default; building with
# --no-default-features yields a fully permissive dependency tree.
raw = ["dep:rawler"]

[dependencies]
nanoid = "0.5"
image = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
arboard = "3.6"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
glam = { version = "0.32", features = ["serde"] }
reqwest = "0.13"
fastrand = "2"
noise = "0.9"
ab_glyph = "0.2"
rayon = "1"
dashmap = "6"
jxl-oxide = "0.12.6"
psd = "0.3.5"
# Pure-Rust HEIC/HEIF decode (our own library: github.com/dan335/heif-oxide).
heif-oxide = "0.1.0"
# Camera RAW decode (Canon CR3/CR2, Nikon NEF, Sony ARW, DNG, ...). Pure Rust.
# Exact-pinned: rawler's API is explicitly not SemVer-stable.
rawler = { version = "=0.7.2", optional = true }
sanitize-filename = "0.6"

[dev-dependencies]
filetime = "0.2"
