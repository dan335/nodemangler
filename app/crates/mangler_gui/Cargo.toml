[package]
name = "mangler_gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "NodeMangler desktop app: a node-based visual editor for image and color manipulation, built with egui/eframe."
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
egui_glow = "0.36"
epaint = "0.36"
glow = "0.17"  # egui_glow 0.36 still requires glow ^0.17 (not 0.18)
image = "0.25"
# Scaled-IDCT JPEG decode for library thumbs (zune-jpeg via `image` has no scale path).
jpeg-decoder = "0.3"
mangler_core = { path = "../mangler_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
puffin = "0.19"
# In-egui file dialog (themed, non-blocking) rather than a native OS panel.
# `information_view` is deliberately off: it pulls chrono + image-meta +
# indexmap for a metadata side panel we do not show.
egui-file-dialog = { version = "0.15", default-features = false, features = ["serde"] }
time = "0.3"
glam = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
fastrand = "2.0"
egui_extras = "0.36"
dirs = "6"
rayon = "1"
# Library-panel deletes go to the OS recycle bin (recoverable), never
# straight to permanent removal.
trash = "5"
# Headless rendering of real widgets to PNG, so UI chrome can be *looked at*
# without launching the app (see `ui_snapshots.rs`). Optional and off by
# default: it pulls in wgpu, which is a long compile nobody should pay for on
# an ordinary build or in CI. Dev-dependencies cannot be optional, hence a
# regular dependency behind a feature.
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"], optional = true }

[features]
# Enables the `ui_snapshots` tests, which render dialogs and panels to PNGs in
# `target/ui-snapshots/` so they can be inspected without running the app:
#   cargo test -p mangler_gui --features ui-snapshots -- --ignored --nocapture
ui-snapshots = ["dep:egui_kittest"]

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "windef"] }

[dev-dependencies]
# `icons_tests.rs` checks every vendored codepoint resolves to a real glyph in
# `res/Phosphor.ttf`. A wrong codepoint renders as tofu, which is silent.
ab_glyph = "0.2"
