# Vendored copy of smithay-clipboard 0.7.3 (MIT, see LICENSE), patched in via
# `[patch.crates-io]` in the workspace Cargo.toml. The only change from upstream
# is Wayland drag-and-drop support in `src/dnd.rs` -- see the README section
# "NodeMangler patch" for why it has to live here rather than in our own code.
#
# Derived from the crates.io-normalized manifest; the example and its
# dev-dependencies are dropped since the example isn't vendored.

[package]
edition = "2024"
rust-version = "1.85.0"
name = "smithay-clipboard"
version = "0.7.3"
authors = [
    "Kirill Chibisov <contact@kchibisov.com>",
    "Elinor Berger <elinor@safaradeg.net>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Provides access to the wayland clipboard for client applications."
documentation = "https://smithay.github.io/smithay-clipboard"
readme = "README.md"
keywords = [
    "clipboard",
    "wayland",
]
license = "MIT"
repository = "https://github.com/smithay/smithay-clipboard"

[features]
default = ["dlopen"]
dlopen = ["wayland-backend/dlopen"]

[lib]
name = "smithay_clipboard"
path = "src/lib.rs"

[dependencies.libc]
version = "0.2.149"

[dependencies.sctk]
version = "0.20.0"
features = ["calloop"]
default-features = false
package = "smithay-client-toolkit"

[dependencies.wayland-backend]
version = "0.3.5"
features = ["client_system"]
default-features = false
